<!doctype html>
<html lang="uk">
<meta charset="utf-8" />
<style>
  :root { --bg: #fff; --fg: #1f1f1f; --muted: #6b6b6b; --line: #e6e6e6; --hover: #f4f4f4; --accent: #d97757; --accent-hover: #c96a4b; --track: #eee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1e1e; --fg: #ececec; --muted: #9a9a9a; --line: #333; --hover: #2a2a2a; --track: #2c2c2c; }
  }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; width: 340px; padding: 14px; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  h2 { margin: 16px 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .row > :last-child { flex-shrink: 0; }
  .big { font-size: 15px; font-weight: 600; }
  .muted { color: var(--muted); }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .loading { opacity: .5; }

  .bar { height: 6px; margin: 6px 0 4px; border-radius: 3px; background: var(--track); overflow: hidden; display: flex; }
  .bar div { height: 100%; width: 0; transition: width 300ms ease-out; }
  #barDia { background: var(--accent); }
  #barRest { background: var(--muted); opacity: .45; }

  button { width: 100%; min-height: 36px; margin-top: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    transition-property: transform, background-color, opacity; transition-duration: 150ms; transition-timing-function: ease-out; }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:active:not(:disabled) { transform: scale(.97); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
  #result { min-height: 1.4em; margin-top: 6px; text-align: center; text-wrap: pretty; transition: opacity 150ms ease-out; }

  ul { margin: 0; padding: 0; list-style: none; }
  li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); }
  li > :last-child { flex-shrink: 0; }
  #history { max-height: 220px; overflow-y: auto; }
  details { border-top: 1px solid var(--line); }
  summary { display: flex; justify-content: space-between; gap: 8px; padding: 5px 4px; margin: 0 -4px; border-radius: 4px; cursor: pointer; list-style: none; transition: background-color 150ms ease-out; }
  summary::-webkit-details-marker { display: none; }
  summary:hover { background: var(--hover); }
  details ul { padding: 0 0 6px 12px; }
  details li { border: 0; padding: 2px 0; color: var(--muted); }
</style>
<body>
  <div class="row big"><span>Dia</span><span id="dia" class="loading">— GB</span></div>
  <div class="bar"><div id="barDia"></div><div id="barRest"></div></div>
  <div class="row muted"><span>Mac зайнято</span><span id="ram"></span></div>
  <div class="muted" id="tabs"></div>

  <button id="sleep">Приспати старі вкладки</button>
  <div class="muted" id="result"></div>

  <h2 id="topTitle">Найважчі вкладки</h2>
  <ul id="top"></ul>

  <h2>За 7 днів</h2>
  <div id="week"></div>

  <h2>Історія</h2>
  <div id="history"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
